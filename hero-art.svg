<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-label="Abstract music and technology collage">
  <defs>
    <linearGradient id="hot" x1=".85" y1="0" x2=".1" y2="1" objectBoundingBox="true">
      <stop stop-color="#f52934"/>
      <stop offset=".46" stop-color="#ff5140"/>
      <stop offset="1" stop-color="#ffbd71"/>
    </linearGradient>
    <linearGradient id="orb" x1=".14" y1=".08" x2=".82" y2=".95" objectBoundingBox="true">
      <stop stop-color="#ff443b"/>
      <stop offset=".62" stop-color="#ff7350"/>
      <stop offset="1" stop-color="#ffcf95"/>
    </linearGradient>
    <linearGradient id="sun" x1=".35" y1="0" x2=".55" y2="1" objectBoundingBox="true">
      <stop stop-color="#fff3d7"/>
      <stop offset=".45" stop-color="#ffe0af"/>
      <stop offset="1" stop-color="#ff795a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="1" x2="1" y2=".1" objectBoundingBox="true">
      <stop stop-color="#070e1b"/>
      <stop offset=".55" stop-color="#17132e"/>
      <stop offset="1" stop-color="#8f3df0"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1=".55" x2="1" y2=".3" objectBoundingBox="true">
      <stop stop-color="#101329"/>
      <stop offset=".45" stop-color="#211244"/>
      <stop offset=".78" stop-color="#6e28cc"/>
      <stop offset="1" stop-color="#b972ff"/>
    </linearGradient>
    <linearGradient id="ground" x1=".18" y1=".45" x2=".89" y2=".25" objectBoundingBox="true">
      <stop stop-color="#090f21"/>
      <stop offset=".43" stop-color="#181637"/>
      <stop offset=".72" stop-color="#7f42d1"/>
      <stop offset="1" stop-color="#f7d9f1"/>
    </linearGradient>
    <linearGradient id="headphone" x1=".1" y1=".2" x2=".9" y2=".8" objectBoundingBox="true">
      <stop stop-color="#ffe8df"/>
      <stop offset=".55" stop-color="#a759ef"/>
      <stop offset="1" stop-color="#371382"/>
    </linearGradient>
    <pattern id="dots" width="29" height="28" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="9" r="4" fill="#6330be"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".53" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="3" intercept="-1"/>
        <feFuncG type="linear" slope="3" intercept="-1"/>
        <feFuncB type="linear" slope="3" intercept="-1"/>
        <feFuncA type="linear" slope=".35"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="art-clip"><rect width="1536" height="1024"/></clipPath>
  </defs>

  <g clip-path="url(#art-clip)">
