<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1284 128" width="1284" height="128" role="img" aria-labelledby="name-title">
  <title id="name-title">Dahong Luo — geometric, textured lettering</title>
  <view id="dahong" viewBox="0 0 828 128" />
  <view id="luo" viewBox="876 0 408 128" />
  <defs>
    <linearGradient id="amethyst" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#9968d8" /><stop offset=".6" stop-color="#b98de5" /><stop offset="1" stop-color="#dac8f0" />
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#8052c5" /><stop offset=".55" stop-color="#ad81df" /><stop offset="1" stop-color="#d5b4ec" />
    </linearGradient>
    <linearGradient id="lilac" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#5f3bb7" /><stop offset=".52" stop-color="#9968d8" /><stop offset="1" stop-color="#cda1c9" />
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#d93c34" /><stop offset=".52" stop-color="#f65933" /><stop offset="1" stop-color="#fcd1a9" />
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5f2e8" /><stop offset=".65" stop-color="#fcd1a9" /><stop offset="1" stop-color="#cda1c9" />
    </linearGradient>
    <linearGradient id="peach" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#fcd1a9" /><stop offset="1" stop-color="#f5f2e8" />
    </linearGradient>

    <pattern id="chips" width="19" height="23" patternUnits="userSpaceOnUse">
      <path d="m2 3 4-1 1 3-3 2Zm9 12 3-3 2 4-4 2Z" fill="#f5f2e8" opacity=".5" />
      <path d="m14 4 3 1-1 3-3-1Z" fill="#fcd1a9" opacity=".7" />
      <circle cx="4" cy="19" r="1" fill="#111528" opacity=".6" />
    </pattern>
    <pattern id="halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#f5f2e8" opacity=".55" />
      <circle cx="6" cy="6" r=".8" fill="#28215a" opacity=".4" />
    </pattern>
    <pattern id="engraving" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <path d="M2 0v10M5 0v10" stroke="#28215a" stroke-width=".8" opacity=".38" />
      <path d="M7 0v10" stroke="#f5f2e8" stroke-width="1" opacity=".55" />
    </pattern>
    <pattern id="contours" width="32" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <path d="M-16 6Q-8-3 0 6T16 6T32 6T48 6M-16 18Q-8 9 0 18T16 18T32 18T48 18" fill="none" stroke="#28215a" stroke-width="1.1" opacity=".4" />
    </pattern>
    <pattern id="woven" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M1 1h6M1 4h6M8 8h6M8 11h6" stroke="#28215a" stroke-width="1" opacity=".4" />
      <path d="M9 0v6M12 0v6M2 8v6M5 8v6" stroke="#f5f2e8" stroke-width="1.4" opacity=".65" />
    </pattern>
    <pattern id="stardust" width="23" height="27" patternUnits="userSpaceOnUse">
      <g fill="#5f3bb7" opacity=".45"><circle cx="4" cy="6" r="1.4"/><circle cx="17" cy="21" r=".7"/><path d="m14 8 2-3 2 3-2 2Z"/></g>
      <path d="m3 20 2-2 2 3-3 2ZM20 1l2 1-1 3-2-2Z" fill="#f65933" opacity=".5" />
    </pattern>
    <pattern id="strata" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="M0 2h16M0 5h16M0 12h16" stroke="#28215a" stroke-width=".8" opacity=".4" />
      <path d="M0 8h16" stroke="#f5f2e8" stroke-width="2" opacity=".5" />
    </pattern>
    <pattern id="pebbles" width="21" height="19" patternUnits="userSpaceOnUse">
      <g fill="#28215a" opacity=".23"><circle cx="4" cy="5" r="2.4"/><circle cx="15" cy="12" r="3.2"/><circle cx="3" cy="16" r="1"/></g>
      <circle cx="15" cy="3" r="1.2" fill="#f5f2e8" opacity=".7" />
    </pattern>
    <pattern id="fans" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 32A32 32 0 0 1 32 0M8 32A24 24 0 0 1 32 8M16 32A16 16 0 0 1 32 16M24 32A8 8 0 0 1 32 24" fill="none" stroke="#28215a" stroke-width="1" opacity=".4" />
    </pattern>

    <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="3" seed="17" stitchTiles="stitch" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="gray" />
      <feComponentTransfer in="gray" result="soft">
        <feFuncR type="linear" slope=".24" intercept=".8" />
        <feFuncG type="linear" slope=".24" intercept=".8" />
        <feFuncB type="linear" slope=".24" intercept=".8" />
      </feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="in" result="grain" />
      <feBlend in="SourceGraphic" in2="grain" mode="multiply" />
    </filter>

    <clipPath id="shape-d"><path clip-rule="evenodd" d="M0 0h64a64 64 0 0 1 0 128H0Z M54 55v18h18V55Z" /></clipPath>
    <clipPath id="shape-a"><path clip-rule="evenodd" d="M0 64a64 64 0 0 1 128 0v64c-36 0-64-28-64-52 0 24-28 52-64 52Z M56 43v20h16V43Z" /></clipPath>
    <clipPath id="shape-h"><path d="M0 0h44v50h40V0h44v128H84V78H44v50H0Z" /></clipPath>
    <clipPath id="shape-o"><path clip-rule="evenodd" d="M64 0a64 64 0 1 1 0 128 64 64 0 1 1 0-128Z M55 55v18h18V55Z" /></clipPath>
    <clipPath id="shape-n"><path d="M0 0h35l58 71V0h35v128H93L35 57v71H0Z" /></clipPath>
    <clipPath id="shape-g"><path d="M64 0C29 0 0 29 0 64s29 64 64 64h64V68H72v28H64V32h64C116 12 92 0 64 0Z" /></clipPath>
    <clipPath id="shape-l"><path d="M0 0h44v84h84v44H0Z" /></clipPath>
    <clipPath id="shape-u"><path d="M0 0h44v64a20 20 0 0 0 40 0V0h44v64a64 64 0 0 1-128 0Z" /></clipPath>
  </defs>

  <g filter="url(#paper)">
    <g data-character="D" clip-path="url(#shape-d)">
      <path d="M0 0h128v128H0Z" fill="url(#amethyst)" />
      <path d="M0 0h64v64Z" fill="url(#peach)" />
      <path d="M0 64h64L0 128Z" fill="url(#ivory)" />
      <path d="M64 64h64v64H64Z" fill="url(#violet)" />
      <path d="M0 0h128v128H0Z" fill="url(#chips)" />
    </g>
    <g data-character="A" transform="translate(140)" clip-path="url(#shape-a)">
      <path d="M0 0h128v128H0Z" fill="url(#violet)" />
      <path d="M64 0h64v64H64Z" fill="url(#lilac)" />
      <path d="M0 64h64v64H0Z" fill="url(#amethyst)" />
      <path d="M64 64h64v64H64Z" fill="url(#peach)" />
      <path d="M0 0h128v128H0Z" fill="url(#halftone)" />
    </g>
    <g data-character="H" transform="translate(280)" clip-path="url(#shape-h)">
      <path d="M0 0h128v128H0Z" fill="url(#peach)" />
      <path d="M0 0h44v50Z" fill="url(#lilac)" />
      <path d="M84 0h44L84 50Z" fill="url(#coral)" />
      <path d="M0 78h44v50Z" fill="url(#violet)" />
      <path d="M84 78h44v50Z" fill="url(#lilac)" />
      <path d="M0 0h128v128H0Z" fill="url(#engraving)" />
    </g>
    <g data-character="O" transform="translate(420)" clip-path="url(#shape-o)">
      <path d="M0 0h128v128H0Z" fill="url(#ivory)" />
      <path d="M0 0h64v64H0Z" fill="url(#coral)" />
      <path d="M64 64h64v64H64Z" fill="url(#lilac)" />
      <path d="M0 0h128v128H0Z" fill="url(#contours)" />
    </g>
    <g data-character="N" transform="translate(560)" clip-path="url(#shape-n)">
      <path d="M0 0h128v128H0Z" fill="url(#peach)" />
      <path d="M0 0h35l93 128H93Z" fill="url(#lilac)" />
      <path d="M93 0h35v71Z" fill="url(#coral)" />
      <path d="M0 57l35 71H0Z" fill="url(#ivory)" />
      <path d="M0 0h128v128H0Z" fill="url(#woven)" />
    </g>
    <g data-character="G" transform="translate(700)" clip-path="url(#shape-g)">
      <path d="M0 0h128v128H0Z" fill="url(#ivory)" />
      <path d="M64 0h64v64H64Z" fill="url(#coral)" />
      <path d="M64 68h64v60H64Z" fill="url(#lilac)" />
      <path d="M0 0h128v128H0Z" fill="url(#stardust)" />
    </g>

    <g data-character="L" transform="translate(876)" clip-path="url(#shape-l)">
      <path d="M0 0h128v128H0Z" fill="url(#lilac)" />
      <path d="M0 0h44v84Z" fill="url(#peach)" />
      <path d="M0 84h128v44H0Z" fill="url(#ivory)" />
      <path d="M84 84h44v44Z" fill="url(#coral)" />
      <path d="M0 0h128v128H0Z" fill="url(#strata)" />
    </g>
    <g data-character="U" transform="translate(1016)" clip-path="url(#shape-u)">
      <path d="M0 0h128v128H0Z" fill="url(#peach)" />
      <path d="M84 0h44v64H84Z" fill="url(#lilac)" />
      <path d="M0 64h64v64H0Z" fill="url(#coral)" />
      <path d="M64 64h64v64H64Z" fill="url(#ivory)" />
      <path d="M0 0h128v128H0Z" fill="url(#pebbles)" />
    </g>
    <g data-character="O" transform="translate(1156)" clip-path="url(#shape-o)">
      <path d="M0 0h128v128H0Z" fill="url(#peach)" />
      <path d="M0 0h64v64H0Z" fill="url(#lilac)" />
      <path d="M64 64h64v64H64Z" fill="url(#coral)" />
      <path d="M0 0h128v128H0Z" fill="url(#fans)" />
    </g>
  </g>
</svg>
